ComponentDefinitions:
  lcsDataTable:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks data table: table, card and list views of your rows, a row you select to open, coloured pills, segmented progress, sortable headers that tell your app, checkboxes with bulk actions, a row menu, and loading and empty states."
    CustomProperties:
      Columns:
        PropertyKind: Input
        DisplayName: Columns
        DataType: Table
        Description: "The columns, in order, up to six: Label, Width in pixels, and Kind: Text, Strong (bold), Badge (a coloured pill) or Progress (a segmented bar from text such as 2/4). Column 1 shows C1 from Rows, and so on."
        Default: |-
          =Table(
              {Label: "Order", Width: 110, Kind: "Strong"},
              {Label: "Customer", Width: 200, Kind: "Text"},
              {Label: "Status", Width: 140, Kind: "Badge"},
              {Label: "Progress", Width: 190, Kind: "Progress"},
              {Label: "Due", Width: 110, Kind: "Text"},
              {Label: "Priority", Width: 110, Kind: "Badge"}
          )
      Rows:
        PropertyKind: Input
        DisplayName: Rows
        DataType: Table
        Description: "The rows: Id, and the text for each column in C1 to C6. Sort, filter and page them in your app."
        Default: |-
          =Table(
              {Id: "1001", C1: "#1001", C2: "Avery Brooks", C3: "In progress", C4: "2/4", C5: "Mar 3", C6: "High"},
              {Id: "1002", C1: "#1002", C2: "Jordan Lee", C3: "Completed", C4: "5/5", C5: "Mar 5", C6: "Medium"},
              {Id: "1003", C1: "#1003", C2: "Priya Nair", C3: "On hold", C4: "1/3", C5: "Mar 9", C6: "Low"},
              {Id: "1004", C1: "#1004", C2: "Mateo Alvarez", C3: "Not started", C4: "0/4", C5: "Mar 12", C6: "High"}
          )
      BadgeStyles:
        PropertyKind: Input
        DisplayName: BadgeStyles
        DataType: Table
        Description: "The colours of Badge pills by their text: Value, Fill and Ink. Text with no style is grey."
        Default: |-
          =Table(
              {Value: "In progress", Fill: RGBA(219, 234, 254, 1), Ink: RGBA(30, 64, 175, 1)},
              {Value: "Completed", Fill: RGBA(220, 252, 231, 1), Ink: RGBA(22, 101, 52, 1)},
              {Value: "On hold", Fill: RGBA(254, 243, 199, 1), Ink: RGBA(146, 64, 14, 1)},
              {Value: "Not started", Fill: RGBA(243, 244, 246, 1), Ink: RGBA(75, 85, 99, 1)},
              {Value: "High", Fill: RGBA(254, 226, 226, 1), Ink: RGBA(153, 27, 27, 1)},
              {Value: "Medium", Fill: RGBA(254, 243, 199, 1), Ink: RGBA(146, 64, 14, 1)},
              {Value: "Low", Fill: RGBA(220, 252, 231, 1), Ink: RGBA(22, 101, 52, 1)}
          )
      View:
        PropertyKind: Input
        DisplayName: View
        DataType: Text
        Description: "The view to start with: Table, Cards or List."
        Default: ="Table"
      ShowViewToggle:
        PropertyKind: Input
        DisplayName: ShowViewToggle
        DataType: Boolean
        Description: "Shows the Table, Cards and List switch."
        Default: =true
      TitleColumn:
        PropertyKind: Input
        DisplayName: TitleColumn
        DataType: Number
        Description: "The column that names a row: the title of a card or list item, and the name screen readers hear."
        Default: =2
      SubtitleColumn:
        PropertyKind: Input
        DisplayName: SubtitleColumn
        DataType: Number
        Description: "The column shown small above a card's title and under a list item's."
        Default: =1
      Sortable:
        PropertyKind: Input
        DisplayName: Sortable
        DataType: Boolean
        Description: "Column headers can be selected to sort. The table runs OnSort; your app sorts Rows."
        Default: =true
      Selectable:
        PropertyKind: Input
        DisplayName: Selectable
        DataType: Boolean
        Description: "Shows a checkbox on each row, and one to select them all in table view."
        Default: =true
      BulkActions:
        PropertyKind: Input
        DisplayName: BulkActions
        DataType: Text
        Description: "Buttons for the selected rows, separated by commas, such as Approve,Reject. Up to three. Leave empty for none."
        Default: =""
      RowActions:
        PropertyKind: Input
        DisplayName: RowActions
        DataType: Text
        Description: "The row menu, separated by commas, such as View,Edit,Delete. Up to three. Leave empty for no menu."
        Default: ="View,Edit,Delete"
      Density:
        PropertyKind: Input
        DisplayName: Density
        DataType: Text
        Description: "Comfortable (60 tall rows, easy to touch) or Compact (44)."
        Default: ="Comfortable"
      Loading:
        PropertyKind: Input
        DisplayName: Loading
        DataType: Boolean
        Description: "Shows grey placeholder rows while your app loads the data."
        Default: =false
      EmptyTitle:
        PropertyKind: Input
        DisplayName: EmptyTitle
        DataType: Text
        Description: "The heading when there are no rows."
        Default: ="No items found"
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        DataType: Text
        Description: "The line under it."
        Default: ="Try changing your search or filters."
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        DataType: Color
        Description: "Your brand colour, for progress, checkboxes and the selected rows."
        Default: =RGBA(15, 108, 189, 1)
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        DataType: Text
        Description: "Light, or Dark for a dark screen."
        Default: ="Light"
      Motion:
        PropertyKind: Input
        DisplayName: Motion
        DataType: Boolean
        Description: "Plays short animations: progress segments fill in one after another, a highlight sweeps once across the loading rows, and the empty state's icon pops in. None plays for people who've asked their device for reduced motion."
        Default: =true
      CurrentView:
        PropertyKind: Output
        DisplayName: CurrentView
        DataType: Text
        Description: "The view shown now: Table, Cards or List."
      SortColumn:
        PropertyKind: Output
        DisplayName: SortColumn
        DataType: Number
        Description: "The column sorted by, from 1; 0 for none."
      SortDescending:
        PropertyKind: Output
        DisplayName: SortDescending
        DataType: Boolean
        Description: "True when the sort runs from Z to A or high to low."
      SelectedIds:
        PropertyKind: Output
        DisplayName: SelectedIds
        DataType: Text
        Description: "The selected rows' Ids, separated by semicolons."
      SelectedCount:
        PropertyKind: Output
        DisplayName: SelectedCount
        DataType: Number
        Description: "How many rows are selected, including any no longer in Rows."
      SelectedRows:
        PropertyKind: Output
        DisplayName: SelectedRows
        DataType: Table
        Description: "The selected rows that are in Rows now."
      OnRowSelect:
        PropertyKind: Event
        DisplayName: OnRowSelect
        ReturnType: None
        Description: "Runs in your app when the user selects a row, a card or a list item, such as to open it."
        Parameters:
          - RowId:
              DataType: Text
              Description: "The selected row's Id."
              Default: =""
        Default: =false
      OnRowAction:
        PropertyKind: Event
        DisplayName: OnRowAction
        ReturnType: None
        Description: "Runs in your app when the user chooses from a row's menu."
        Parameters:
          - Action:
              DataType: Text
              Description: "The action's text, such as Edit."
              Default: =""
          - RowId:
              DataType: Text
              Description: "The row's Id."
              Default: =""
        Default: =false
      OnBulkAction:
        PropertyKind: Event
        DisplayName: OnBulkAction
        ReturnType: None
        Description: "Runs in your app when the user selects a button for the selected rows."
        Parameters:
          - Action:
              DataType: Text
              Description: "The button's text, such as Approve."
              Default: =""
          - RowIds:
              DataType: Text
              Description: "The selected rows' Ids, separated by semicolons."
              Default: =""
        Default: =false
      OnSort:
        PropertyKind: Event
        DisplayName: OnSort
        ReturnType: None
        Description: "Runs in your app when the user selects a column header. Sort Rows by that column."
        Parameters:
          - ColumnNumber:
              DataType: Number
              Description: "The column to sort by, from 1."
              Default: =1
          - Descending:
              DataType: Boolean
              Description: "True to sort from Z to A or high to low."
              Default: =false
        Default: =false
      OnViewChange:
        PropertyKind: Event
        DisplayName: OnViewChange
        ReturnType: None
        Description: "Runs in your app when the user switches between Table, Cards and List."
        Parameters:
          - NewView:
              DataType: Text
              Description: "The view now shown."
              Default: ="Table"
        Default: =false
      ClearSelection:
        PropertyKind: Action
        DisplayName: ClearSelection
        ReturnType: None
        Description: "Clears every checkbox, such as after a bulk action."
    Properties:
      Width: =960
      Height: =560
      Fill: =If(lcsDataTable.Theme = "Dark", RGBA(36, 36, 36, 1), RGBA(255, 255, 255, 1))
      CurrentView: =Coalesce(locView, lcsDataTable.View)
      SortColumn: =Coalesce(locSortColumn, 0)
      SortDescending: =Coalesce(locSortDescending, false)
      SelectedIds: =Concat(colSelected, Id, ";")
      SelectedCount: =CountRows(colSelected)
      SelectedRows: =Filter(lcsDataTable.Rows, Id in colSelected.Id)
      ClearSelection: =Clear(colSelected)
    Children:
      - lblSelectedCount:
          Control: ModernText@1.0.0
          Properties:
            X: =4
            Y: =8
            Width: =128
            Height: =40
            Visible: =(lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions))
            Text: =If(CountRows(colSelected) = 0, "Select rows", CountRows(colSelected) & " selected")
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - btnBulk1:
          Control: ModernButton@1.0.0
          Properties:
            X: =136 + 0
            Y: =10
            Width: =104
            Height: =36
            Visible: =(lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)) && CountRows(Split(lcsDataTable.BulkActions, ",")) >= 1
            Text: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 1)).Value)
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =lcsDataTable.AccentColor
            DisplayMode: =If(CountRows(colSelected) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            AccessibleLabel: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 1)).Value) & ", " & CountRows(colSelected) & " selected"
            OnSelect: =lcsDataTable.OnBulkAction(Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 1)).Value), Concat(colSelected, Id, ";"))
      - lblBulk2:
          Control: ModernText@1.0.0
          Properties:
            X: =btnBulk2.X
            Y: =btnBulk2.Y
            Width: =btnBulk2.Width
            Height: =btnBulk2.Height
            Visible: =btnBulk2.Visible
            Text: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 2)).Value)
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(btnBulk2.DisplayMode = DisplayMode.Disabled, If(lcsDataTable.Theme = "Dark", RGBA(110, 110, 110, 1), RGBA(170, 170, 170, 1)), If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1)))
            Fill: =If(lcsDataTable.Theme = "Dark", RGBA(41, 41, 41, 1), RGBA(255, 255, 255, 1))
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PaddingBottom: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
      - btnBulk2:
          Control: Classic/Button@2.2.0
          Properties:
            X: =136 + 112
            Y: =10
            Width: =104
            Height: =36
            Visible: =(lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)) && CountRows(Split(lcsDataTable.BulkActions, ",")) >= 2
            Text: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 2)).Value) & ", " & CountRows(colSelected) & " selected"
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            BorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            BorderThickness: =1
            HoverFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            PressedFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(66, 66, 66, 1), RGBA(229, 231, 235, 1))
            FocusedBorderColor: =If(lcsDataTable.Theme = "Dark", ColorFade(lcsDataTable.AccentColor, 0.45), lcsDataTable.AccentColor)
            FocusedBorderThickness: =2
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            DisplayMode: =If(CountRows(colSelected) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =lcsDataTable.OnBulkAction(Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 2)).Value), Concat(colSelected, Id, ";"))
      - lblBulk3:
          Control: ModernText@1.0.0
          Properties:
            X: =btnBulk3.X
            Y: =btnBulk3.Y
            Width: =btnBulk3.Width
            Height: =btnBulk3.Height
            Visible: =btnBulk3.Visible
            Text: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 3)).Value)
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(btnBulk3.DisplayMode = DisplayMode.Disabled, If(lcsDataTable.Theme = "Dark", RGBA(110, 110, 110, 1), RGBA(170, 170, 170, 1)), If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1)))
            Fill: =If(lcsDataTable.Theme = "Dark", RGBA(41, 41, 41, 1), RGBA(255, 255, 255, 1))
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PaddingBottom: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
      - btnBulk3:
          Control: Classic/Button@2.2.0
          Properties:
            X: =136 + 224
            Y: =10
            Width: =104
            Height: =36
            Visible: =(lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)) && CountRows(Split(lcsDataTable.BulkActions, ",")) >= 3
            Text: =Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 3)).Value) & ", " & CountRows(colSelected) & " selected"
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            BorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            BorderThickness: =1
            HoverFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            PressedFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(82, 82, 82, 1), RGBA(209, 213, 219, 1))
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =If(lcsDataTable.Theme = "Dark", RGBA(66, 66, 66, 1), RGBA(229, 231, 235, 1))
            FocusedBorderColor: =If(lcsDataTable.Theme = "Dark", ColorFade(lcsDataTable.AccentColor, 0.45), lcsDataTable.AccentColor)
            FocusedBorderThickness: =2
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            DisplayMode: =If(CountRows(colSelected) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =lcsDataTable.OnBulkAction(Trim(Last(FirstN(Split(lcsDataTable.BulkActions, ","), 3)).Value), Concat(colSelected, Id, ";"))
      - lblClearSelection:
          Control: ModernText@1.0.0
          Properties:
            X: =btnClearSelection.X
            Y: =btnClearSelection.Y
            Width: =btnClearSelection.Width
            Height: =btnClearSelection.Height
            Visible: =btnClearSelection.Visible
            Text: ="Clear selection"
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 1), RGBA(36, 36, 36, 1))
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PaddingBottom: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
      - btnClearSelection:
          Control: Classic/Button@2.2.0
          Properties:
            X: =136 + Min(3, CountRows(Split(lcsDataTable.BulkActions, ","))) * 112
            Y: =10
            Width: =128
            Height: =36
            Visible: =(lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)) && CountRows(colSelected) > 0
            Text: ="Clear selection"
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =If(lcsDataTable.Theme = "Dark", ColorFade(lcsDataTable.AccentColor, 0.45), lcsDataTable.AccentColor)
            FocusedBorderThickness: =2
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            OnSelect: =Clear(colSelected)
      - tabView:
          Control: ModernTabList@1.0.0
          Properties:
            X: =Parent.Width - 256
            Y: =8
            Width: =256
            Height: =40
            Visible: =lcsDataTable.ShowViewToggle
            Items: =["Table", "Cards", "List"]
            Default: |-
              ={Value: Coalesce(locView, lcsDataTable.View)}
            Appearance: =TabListAppearance.Subtle
            Alignment: =TabListAlignment.Start
            AccessibleLabel: ="View"
            OnChange: |-
              =Set(locView, tabView.Selected.Value);
              lcsDataTable.OnViewChange(tabView.Selected.Value)
      - shpHeader:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =If(lcsDataTable.ShowViewToggle || (lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)), 56, 0)
            Width: =Parent.Width
            Height: =44
            Visible: =Coalesce(locView, lcsDataTable.View) = "Table" && CountRows(lcsDataTable.Rows) > 0 && !lcsDataTable.Loading
            Fill: =If(lcsDataTable.Theme = "Dark", RGBA(46, 46, 46, 1), RGBA(249, 250, 251, 1))
      - shpHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =If(lcsDataTable.ShowViewToggle || (lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)), 56, 0) + 44
            Width: =Parent.Width
            Height: =1
            Visible: =shpHeader.Visible
            Fill: =If(lcsDataTable.Theme = "Dark", RGBA(66, 66, 66, 1), RGBA(229, 231, 235, 1))
      - chkAll:
          Control: Classic/CheckBox@2.1.0
          Properties:
            X: =12
            Y: =If(lcsDataTable.ShowViewToggle || (lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)), 56, 0) + 6
            Width: =32
            Height: =32
            Visible: =shpHeader.Visible && lcsDataTable.Selectable
            Text: ="Select all rows"
            Color: =RGBA(0, 0, 0, 0)
            Size: =10
            Default: =(CountRows(lcsDataTable.Rows) > 0 && CountRows(Filter(lcsDataTable.Rows, Id in colSelected.Id)) = CountRows(lcsDataTable.Rows))
            CheckboxSize: =18
            CheckmarkFill: =RGBA(255, 255, 255, 1)
            CheckboxBackgroundFill: =If(Self.Value, lcsDataTable.AccentColor, If(lcsDataTable.Theme = "Dark", RGBA(36, 36, 36, 1), RGBA(255, 255, 255, 1)))
            CheckboxBorderColor: =If(Self.Value, lcsDataTable.AccentColor, If(lcsDataTable.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1)))
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            FocusedBorderColor: =lcsDataTable.AccentColor
            FocusedBorderThickness: =2
            OnSelect: |-
              =If((CountRows(lcsDataTable.Rows) > 0 && CountRows(Filter(lcsDataTable.Rows, Id in colSelected.Id)) = CountRows(lcsDataTable.Rows)), RemoveIf(colSelected, Id in lcsDataTable.Rows.Id), ForAll(Filter(lcsDataTable.Rows, !(Id in colSelected.Id)), Collect(colSelected, {Id: ThisRecord.Id})))
      - lblHeader1Button:
          Control: ModernText@1.0.0
          Properties:
            X: =btnHeader1.X
            Y: =btnHeader1.Y
            Width: =btnHeader1.Width
            Height: =btnHeader1.Height
            Visible: =btnHeader1.Visible
            Text: =Last(FirstN(lcsDataTable.Columns, 1)).Label & If(locSortColumn = 1, If(locSortDescending, " ↓", " ↑"), "")
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsDataTable.Theme = "Dark", RGBA(173, 173, 173, 1), RGBA(97, 97, 97, 1))
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Left
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingLeft: =12
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
      - btnHeader1:
          Control: Classic/Button@2.2.0
          Properties:
            X: =If(lcsDataTable.Selectable, 48, 0)
            Y: =If(lcsDataTable.ShowViewToggle || (lcsDataTable.Selectable && !IsBlank(lcsDataTable.BulkActions)), 56, 0)
            Width: =Last(FirstN(lcsDataTable.Columns, 1)).Width
            Height: =44
            Visible: =Coalesce(locView, lcsDataTable.View) = "Table" && CountRows(lcsDataTable.Rows) > 0 && !lcsDataTable.Loading && CountRows(lcsDataTable.Columns) >= 1 && lcsDataTable.Sortable
            Text: |-
              =Last(FirstN(lcsDataTable.Columns, 1)).Label & ", sort" & If(
                  locSortColumn = 1,
                  If(locSortDescending, ", sorted descending", ", sorted ascending"),
                  ""
              )
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =If(lcsDataTable.Theme = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
            HoverColor: =RGBA(0, 0, 0, 0)
