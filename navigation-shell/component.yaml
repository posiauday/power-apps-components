                  BorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 0.08), RGBA(0, 0, 0, 0.05))
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", RGBA(255, 255, 255, 0.14), RGBA(0, 0, 0, 0.09))
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(0, 0, 0, 0)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =If(Coalesce(locTheme, lcsNavShell.Theme) = "Dark", ColorFade(lcsNavShell.AccentColor, 0.45), lcsNavShell.AccentColor)
                  FocusedBorderThickness: =2
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Tooltip: =ThisItem.Label
                  DisplayMode: =If(ThisItem.Key in ForAll(Split(lcsNavShell.DisabledKeys, ","), Trim(ThisRecord.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                  OnSelect: |-
                    =Set(locSelected, ThisItem.Key);
                    lcsNavShell.OnNavigate(ThisItem.Key)
