ComponentDefinitions:
  lcsAttachmentList:
    DefinitionType: CanvasComponent
    Description: "LowCodeStacks attachments: a drop card that adds files (choose or drag), each with a status and a reason when it can't go, the files already attached with Open and remove-and-undo, and one Upload button that hands everything to your app; light and dark, with motion."
    AccessAppScope: true
    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        DataType: Text
        Description: "The heading at the top of the card."
        Default: ="Upload documents"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        DataType: Text
        Description: "A line under the heading. Empty shows none."
        Default: ="Add the files for this request"
      Files:
        PropertyKind: Input
        DisplayName: Files
        DataType: Table
        Description: "The files already attached, as a table with Key, Name, Size (bytes, 0 when unknown), Url (a link that opens the file, or empty), Who and When columns."
        Default: |-
          =Table({Key: "f1", Name: "Site survey.pdf", Size: 1843200, Url: "", Who: "Dana Kaur", When: DateAdd(Now(), -2, TimeUnit.Days)}, {Key: "f2", Name: "Notes.docx", Size: 23552, Url: "", Who: "Sam Okafor", When: DateAdd(Now(), -20, TimeUnit.Minutes)})
      AcceptedTypes:
        PropertyKind: Input
        DisplayName: AcceptedTypes
        DataType: Text
        Description: "The file types people can add, as extensions separated by commas, such as pdf,docx,xlsx. Shown as chips; another type is added with a reason and isn't uploaded. Empty accepts any type."
        Default: ="pdf,docx,xlsx,png,jpg"
      MaxFiles:
        PropertyKind: Input
        DisplayName: MaxFiles
        DataType: Number
        Description: "The most files people can add before they upload. Files already attached don't count."
        Default: =3
      MaxFileSize:
        PropertyKind: Input
        DisplayName: MaxFileSize
        DataType: Number
        Description: "The largest file in megabytes (1 MB is 1,000,000 bytes). Power Apps' Attachments control refuses a bigger file with its own message."
        Default: =10
      AllowUpload:
        PropertyKind: Input
        DisplayName: AllowUpload
        DataType: Boolean
        Description: "Shows the drop card and the Upload button. Off, the card lists the files already attached."
        Default: =true
      AllowRemove:
        PropertyKind: Input
        DisplayName: AllowRemove
        DataType: Boolean
        Description: "Shows a remove button on each file already attached. Removing marks the file, with Undo, until the changes are saved."
        Default: =true
      IsUploading:
        PropertyKind: Input
        DisplayName: IsUploading
        DataType: Boolean
        Description: "Set it to true while your app saves (in OnSave), and back to false after: each file shows a moving bar, the button spins, and nothing can be changed."
        Default: =false
      ShowMeta:
        PropertyKind: Input
        DisplayName: ShowMeta
        DataType: Text
        Description: "Which details show under a file already attached: size, who, when, or any of them separated by commas. Empty shows none."
        Default: ="size,who,when"
      OpenOnSelect:
        PropertyKind: Input
        DisplayName: OpenOnSelect
        DataType: Boolean
        Description: "Opens an attached file's Url in a new tab when its row is selected, before OnOpen runs. Off, only OnOpen runs."
        Default: =true
      EmptyText:
        PropertyKind: Input
        DisplayName: EmptyText
        DataType: Text
        Description: "What the card says when AllowUpload is off and nothing is attached."
        Default: ="No files yet"
      MaxHeight:
        PropertyKind: Input
        DisplayName: MaxHeight
        DataType: Number
        Description: "The most height the files already attached take before they scroll. 0 grows with the list."
        Default: =0
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        DataType: Color
        Description: "Your brand colour, for the drop card, the button, the focus rings and files of a type without a colour of its own."
        Default: =RGBA(15, 108, 189, 1)
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        DataType: Text
        Description: "Light, or Dark for a dark screen."
        Default: ="Light"
      Motion:
        PropertyKind: Input
        DisplayName: Motion
        DataType: Boolean
        Description: "The arrow bobs when the card appears, tiles pop in, ticks draw in, and bars move while uploading. None plays for people who've asked their device for reduced motion."
        Default: =true
      Count:
        PropertyKind: Output
        DisplayName: Count
        DataType: Number
        Description: "How many files are already attached."
      TotalSize:
        PropertyKind: Output
        DisplayName: TotalSize
        DataType: Number
        Description: "The attached files' sizes added up, in bytes."
      TotalSizeText:
        PropertyKind: Output
        DisplayName: TotalSizeText
        DataType: Text
        Description: "The total size as people read it, such as 1.8 MB."
      ReadyCount:
        PropertyKind: Output
        DisplayName: ReadyCount
        DataType: Number
        Description: "How many added files are ready to upload."
      StagedFiles:
        PropertyKind: Output
        DisplayName: StagedFiles
        DataType: Table
        Description: "The files ready to upload, with Name and Value as Power Apps' Attachments control gives them: for a SharePoint item's attachments or a Dataverse file column."
      StagedFilesData:
        PropertyKind: Output
        DisplayName: StagedFilesData
        DataType: Table
        Description: "The files ready to upload as Name and ContentBytes (base64), for a flow that takes text. Built when the Upload button is selected, so read it in OnSave."
      RemovedKeys:
        PropertyKind: Output
        DisplayName: RemovedKeys
        DataType: Table
        Description: "The Key of each attached file marked for removal, in a Key column."
      HasChanges:
        PropertyKind: Output
        DisplayName: HasChanges
        DataType: Boolean
        Description: "True while there are files to upload or files to remove."
      OnOpen:
        PropertyKind: Event
        DisplayName: OnOpen
        ReturnType: None
        Description: "Runs in your app when an attached file's row or Open is selected, with its key, name and link. Open a file your own way here, such as through a flow."
        Parameters:
          - Key:
              DataType: Text
              Description: "The file's Key."
              Default: =""
          - Name:
              DataType: Text
              Description: "The file's Name."
              Default: =""
          - Url:
              DataType: Text
              Description: "The file's Url, which may be empty."
              Default: =""
        Default: =false
      OnSave:
        PropertyKind: Event
        DisplayName: OnSave
        ReturnType: None
        Description: "Runs in your app when Upload is selected, with how many files to upload and to remove. Save StagedFiles (or StagedFilesData for a flow) and remove RemovedKeys, with IsUploading true while you do, then Reset this component."
        Parameters:
          - Ready:
              DataType: Number
              Description: "How many files are ready to upload."
              Default: =0
          - Removed:
              DataType: Number
              Description: "How many attached files are marked for removal."
              Default: =0
        Default: =false
      OnCancel:
        PropertyKind: Event
        DisplayName: OnCancel
        ReturnType: None
        Description: "Runs in your app after Cancel has cleared the added files and the removals, with how many changes were dropped."
        Parameters:
          - Discarded:
              DataType: Number
              Description: "How many added files and removals Cancel cleared."
              Default: =0
        Default: =false
    Properties:
      Width: =480
      Height: |-
        =With(
            {after: ((76 + If(lcsAttachmentList.AllowUpload, (72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) + 16, 0)) + If(CountRows(lcsAttachmentList.Files) > 0, 28 + With({h: 64 * CountRows(lcsAttachmentList.Files)}, If(lcsAttachmentList.MaxHeight > 0, Min(lcsAttachmentList.MaxHeight, h), h)) + 12, If(!lcsAttachmentList.AllowUpload, 60, 0)))},
            If((lcsAttachmentList.AllowUpload || (lcsAttachmentList.AllowRemove && CountRows(lcsAttachmentList.Files) > 0)), after + 70, after + 14)
        )
      Fill: =RGBA(0, 0, 0, 0)
      OnReset: |-
        =Clear(colLcsAttachStaged);
        Clear(colLcsAttachRemoved);
        Clear(colLcsAttachPayload);
        Reset(attPicker)
      Count: =CountRows(lcsAttachmentList.Files)
      TotalSize: =Sum(lcsAttachmentList.Files, Size)
      TotalSizeText: |-
        =With({b: Sum(lcsAttachmentList.Files, Size)}, If(b >= 1048576, Text(b / 1048576, "0.0") & " MB", b >= 1024, Text(Round(b / 1024, 0), "#,##0") & " KB", b & " B"))
      ReadyCount: =CountRows(Filter(colLcsAttachStaged, Status = "Ready"))
      StagedFiles: =ShowColumns(Filter(colLcsAttachStaged, Status = "Ready"), Name, Value)
      StagedFilesData: =colLcsAttachPayload
      RemovedKeys: =colLcsAttachRemoved
      HasChanges: =!IsEmpty(Filter(colLcsAttachStaged, Status = "Ready")) || !IsEmpty(colLcsAttachRemoved)
    Children:
      - shpCard:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =4
            Y: =2
            Width: =Parent.Width - 8
            Height: =Parent.Height - 8
            Fill: =If(lcsAttachmentList.Theme = "Dark", RGBA(43, 43, 46, 1), RGBA(255, 255, 255, 1))
            BorderColor: =If(lcsAttachmentList.Theme = "Dark", RGBA(60, 60, 64, 1), RGBA(232, 234, 237, 1))
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            RadiusTopLeft: =24
            RadiusTopRight: =24
            RadiusBottomLeft: =24
            RadiusBottomRight: =24
      - imgHeadIcon:
          Control: Image@2.2.3
          Properties:
            X: =24
            Y: =22
            Width: =40
            Height: =40
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='14' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, -0.55), ColorFade(lcsAttachmentList.AccentColor, 0.85))), 2, 7) & "'/><g transform='translate(10 10) scale(.8333)'><path d='M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5' fill='none' stroke='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.75), ColorFade(lcsAttachmentList.AccentColor, -0.5))), 2, 7) & "' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></g></svg>")
            ImagePosition: =ImagePosition.Fit
      - lblTitle:
          Control: ModernText@1.0.0
          Properties:
            X: =76
            Y: =If(IsBlank(lcsAttachmentList.Subtitle), 31, 21)
            Width: =Parent.Width - 100 - If(lcsAttachmentList.AllowUpload, RoundUp(Len(lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles)) * 6.6 + 20, 0) + 8, 0)
            Height: =22
            Text: =lcsAttachmentList.Title
            Size: =16
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsAttachmentList.Theme = "Dark", RGBA(241, 241, 243, 1), RGBA(27, 27, 31, 1))
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - lblSubtitle:
          Control: ModernText@1.0.0
          Properties:
            X: =76
            Y: =43
            Width: =Parent.Width - 100 - If(lcsAttachmentList.AllowUpload, RoundUp(Len(lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles)) * 6.6 + 20, 0) + 8, 0)
            Height: =18
            Visible: =!IsBlank(lcsAttachmentList.Subtitle)
            Text: =lcsAttachmentList.Subtitle
            Size: =13
            Color: =If(lcsAttachmentList.Theme = "Dark", RGBA(196, 198, 207, 1), RGBA(68, 71, 78, 1))
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - imgCountPill:
          Control: Image@2.2.3
          Properties:
            X: =Parent.Width - 24 - RoundUp(Len(lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles)) * 6.6 + 20, 0)
            Y: =31
            Width: =RoundUp(Len(lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles)) * 6.6 + 20, 0)
            Height: =22
            Visible: =lcsAttachmentList.AllowUpload
            Image: |-
              =With(
                  {t: lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles), w: RoundUp(Len(lcsAttachmentList.ReadyCount & " of " & Max(1, lcsAttachmentList.MaxFiles)) * 6.6 + 20, 0)},
                  "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " & w & " 22'><!-- " & t & " --><style>.p{transform-box:fill-box;transform-origin:center;animation:lcsAttPop .3s cubic-bezier(.2,1.4,.4,1) both}@keyframes lcsAttPop{from{transform:scale(.7)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.p{animation:none}}</style><g class='" & If(lcsAttachmentList.Motion, "p", "") & "'><rect width='" & w & "' height='22' rx='11' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, -0.55), ColorFade(lcsAttachmentList.AccentColor, 0.85))), 2, 7) & "'/><text x='" & w / 2 & "' y='15' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='12' font-weight='700' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.75), ColorFade(lcsAttachmentList.AccentColor, -0.5))), 2, 7) & "'>" & t & "</text></g></svg>")
              )
            ImagePosition: =ImagePosition.Fit
      - shpDrop:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =24
            Y: =76
            Width: =(Parent.Width - 48)
            Height: =If((CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles)), 64, (72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64))
            Visible: =lcsAttachmentList.AllowUpload
            Fill: =If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), If(lcsAttachmentList.Theme = "Dark", RGBA(52, 52, 55, 1), RGBA(247, 248, 251, 1)), If(lcsAttachmentList.Theme = "Dark", RGBA(52, 52, 55, 1), ColorFade(lcsAttachmentList.AccentColor, 0.95)))
            BorderColor: =If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), If(lcsAttachmentList.Theme = "Dark", RGBA(98, 100, 108, 1), RGBA(196, 199, 207, 1)), If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.1), ColorFade(lcsAttachmentList.AccentColor, 0.55)))
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =2
            DropShadow: =DropShadow.None
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
      - imgDropBubble:
          Control: Image@2.2.3
          Properties:
            X: =24 + ((Parent.Width - 48) - 56) / 2
            Y: =(76 + ((72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) - 146) / 2)
            Width: =56
            Height: =56
            Visible: =lcsAttachmentList.AllowUpload && !(CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'>" & If(lcsAttachmentList.Motion, "<style>.b{animation:lcsAttBob 1.6s ease-in-out 3}@keyframes lcsAttBob{50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style>", "") & "<circle cx='28' cy='28' r='28' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, -0.55), ColorFade(lcsAttachmentList.AccentColor, 0.85))), 2, 7) & "'/><g class='b'><g transform='translate(15 15) scale(1.0833)'><path d='M12 16V4M6 10l6-6 6 6M4 20h16' fill='none' stroke='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.45), lcsAttachmentList.AccentColor)), 2, 7) & "' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/></g></g></svg>")
            ImagePosition: =ImagePosition.Fit
      - lblChoose:
          Control: ModernText@1.0.0
          Properties:
            X: =24 + ((Parent.Width - 48) - 204) / 2
            Y: =(76 + ((72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) - 146) / 2) + 68
            Width: =80
            Height: =20
            Visible: =lcsAttachmentList.AllowUpload && !(CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Text: ="Choose files"
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.45), lcsAttachmentList.AccentColor)
            Underline: =true
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - lblDragHere:
          Control: ModernText@1.0.0
          Properties:
            X: =24 + ((Parent.Width - 48) - 204) / 2 + 84
            Y: =(76 + ((72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) - 146) / 2) + 68
            Width: =120
            Height: =20
            Visible: =lcsAttachmentList.AllowUpload && !(CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Text: ="or drag them here"
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsAttachmentList.Theme = "Dark", RGBA(241, 241, 243, 1), RGBA(27, 27, 31, 1))
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - imgChips:
          Control: Image@2.2.3
          Properties:
            X: |-
              =24 + ((Parent.Width - 48) - With({rows: With({types: FirstN(Filter(ForAll(Split(Lower(lcsAttachmentList.AcceptedTypes), ",") As t, Substitute(Trim(t.Value), ".", "")), !IsBlank(Value)), 8)}, ForAll(Sequence(CountRows(types)) As i, With({t: Upper(Index(types, i.Value).Value)}, {T: t, W: RoundUp(Len(t) * 7.6 + 18, 0)})))}, Sum(rows, W) + Max(0, CountRows(rows) - 1) * 6)) / 2
            Y: =(76 + ((72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) - 146) / 2) + 98
            Width: |-
              =With({rows: With({types: FirstN(Filter(ForAll(Split(Lower(lcsAttachmentList.AcceptedTypes), ",") As t, Substitute(Trim(t.Value), ".", "")), !IsBlank(Value)), 8)}, ForAll(Sequence(CountRows(types)) As i, With({t: Upper(Index(types, i.Value).Value)}, {T: t, W: RoundUp(Len(t) * 7.6 + 18, 0)})))}, Sum(rows, W) + Max(0, CountRows(rows) - 1) * 6)
            Height: =24
            Visible: =lcsAttachmentList.AllowUpload && !(CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles)) && !IsEmpty(Filter(ForAll(Split(Lower(lcsAttachmentList.AcceptedTypes), ",") As t, Substitute(Trim(t.Value), ".", "")), !IsBlank(Value)))
            Image: |-
              =With(
                  {rows: With({types: FirstN(Filter(ForAll(Split(Lower(lcsAttachmentList.AcceptedTypes), ",") As t, Substitute(Trim(t.Value), ".", "")), !IsBlank(Value)), 8)}, ForAll(Sequence(CountRows(types)) As i, With({t: Upper(Index(types, i.Value).Value)}, {T: t, W: RoundUp(Len(t) * 7.6 + 18, 0)})))},
                  With(
                      {placed: ForAll(Sequence(CountRows(rows)) As i, {T: Index(rows, i.Value).T, W: Index(rows, i.Value).W, X: Coalesce(Sum(FirstN(rows, i.Value - 1), W), 0) + (i.Value - 1) * 6}), total: Sum(rows, W) + Max(0, CountRows(rows) - 1) * 6},
                      "data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " & total & " 24'>" & Concat(placed, "<rect x='" & (X + 0.5) & "' y='1.5' width='" & (W - 1) & "' height='21' rx='8' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", RGBA(43, 43, 46, 1), RGBA(255, 255, 255, 1))), 2, 7) & "' stroke='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", RGBA(98, 100, 108, 1), RGBA(196, 199, 207, 1))), 2, 7) & "'/><text x='" & (X + W / 2) & "' y='16' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='11' font-weight='700' fill='" & Mid(JSON(If(lcsAttachmentList.Theme = "Dark", RGBA(196, 198, 207, 1), RGBA(68, 71, 78, 1))), 2, 7) & "'>" & T & "</text>") & "</svg>")
                  )
              )
            ImagePosition: =ImagePosition.Fit
      - lblLimits:
          Control: ModernText@1.0.0
          Properties:
            X: =24
            Y: =(76 + ((72 + Min(Max(1, lcsAttachmentList.MaxFiles), 3) * 64) - 146) / 2) + 130
            Width: =(Parent.Width - 48)
            Height: =16
            Visible: =lcsAttachmentList.AllowUpload && !(CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Text: =If(IsEmpty(Filter(ForAll(Split(Lower(lcsAttachmentList.AcceptedTypes), ",") As t, Substitute(Trim(t.Value), ".", "")), !IsBlank(Value))), "Any type · ", "") & "Up to " & lcsAttachmentList.MaxFileSize & " MB each · " & If(Max(1, lcsAttachmentList.MaxFiles) = 1, "1 file", Max(1, lcsAttachmentList.MaxFiles) & " files at most")
            Size: =12
            Color: =If(lcsAttachmentList.Theme = "Dark", RGBA(196, 198, 207, 1), RGBA(68, 71, 78, 1))
            Align: =Align.Center
            Wrap: =false
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PaddingBottom: =0
      - imgStripBubble:
          Control: Image@2.2.3
          Properties:
            X: =38
            Y: =90
            Width: =36
            Height: =36
            Visible: =lcsAttachmentList.AllowUpload && (CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><circle cx='18' cy='18' r='18' fill='" & If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), Mid(JSON(If(lcsAttachmentList.Theme = "Dark", RGBA(98, 100, 108, 1), RGBA(196, 199, 207, 1))), 2, 7), Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, -0.55), ColorFade(lcsAttachmentList.AccentColor, 0.85))), 2, 7)) & "'/><g transform='translate(8 8) scale(.8333)'><path d='" & If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), "M5 12.5l4.5 4.5L19 7.5", "M12 16V4M6 10l6-6 6 6M4 20h16") & "' fill='none' stroke='" & If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), Mid(JSON(If(lcsAttachmentList.Theme = "Dark", RGBA(196, 198, 207, 1), RGBA(68, 71, 78, 1))), 2, 7), Mid(JSON(If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.45), lcsAttachmentList.AccentColor)), 2, 7)) & "' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></g></svg>")
            ImagePosition: =ImagePosition.Fit
      - lblStripTitle:
          Control: ModernText@1.0.0
          Properties:
            X: =86
            Y: =88
            Width: =(Parent.Width - 48) - 76
            Height: =20
            Visible: =lcsAttachmentList.AllowUpload && (CountRows(colLcsAttachStaged) > 0 || lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles))
            Text: =If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), "That's the most you can add", "Choose more files or drag them here")
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =If(lcsAttachmentList.ReadyCount >= Max(1, lcsAttachmentList.MaxFiles), If(lcsAttachmentList.Theme = "Dark", RGBA(241, 241, 243, 1), RGBA(27, 27, 31, 1)), If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.45), lcsAttachmentList.AccentColor))
            Wrap: =false
            PaddingLeft: =0
