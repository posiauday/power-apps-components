            PressedFill: =If(lcsAttachmentList.Theme = "Dark", RGBA(0, 0, 0, 0.14), RGBA(255, 255, 255, 0.2))
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =If(lcsAttachmentList.Theme = "Dark", ColorFade(lcsAttachmentList.AccentColor, 0.45), lcsAttachmentList.AccentColor)
            FocusedBorderThickness: =2
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            OnSelect: |-
              =ClearCollect(
                  colLcsAttachPayload,
                  ForAll(
                      Filter(galStaged.AllItems, Status = "Ready") As r,
                      {
                          Name: r.Name,
                          ContentBytes: With(
                              {j: JSON(r.imgBlob.Image, JSONFormat.IncludeBinaryData)},
                              Mid(j, Find(",", j) + 1, Len(j) - Find(",", j) - 1)
                          )
                      }
                  )
              );
              lcsAttachmentList.OnSave(lcsAttachmentList.ReadyCount, CountRows(colLcsAttachRemoved))
